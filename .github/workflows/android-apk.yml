name: Build MovieFox Android Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.moviefox --project-name moviefox .

      - name: Configure audio service Activity
        run: |
          mkdir -p android/app/src/main/kotlin/com/moviefox/moviefox
          cat > android/app/src/main/kotlin/com/moviefox/moviefox/MainActivity.kt <<'EOF'
          package com.moviefox.moviefox

          import android.app.DownloadManager
          import android.content.ContentValues
          import android.content.Intent
          import android.net.Uri
          import android.os.Environment
          import android.provider.MediaStore
          import com.ryanheise.audioservice.AudioServiceActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream

          class DownloadForegroundService : android.app.Service() {
              companion object {
                  private const val CHANNEL_ID = "moviefox_download_progress"
                  private const val NOTIFICATION_ID = 7301
              }

              override fun onCreate() {
                  super.onCreate()
                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      val channel = android.app.NotificationChannel(
                          CHANNEL_ID, "Background downloads", android.app.NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(android.app.NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val title = intent?.getStringExtra("title") ?: "MovieFox download"
                  val progress = (intent?.getIntExtra("progress", 0) ?: 0).coerceIn(0, 100)
                  val builder = if (android.os.Build.VERSION.SDK_INT >= 26)
                      android.app.Notification.Builder(this, CHANNEL_ID)
                  else android.app.Notification.Builder(this)
                  val notification = builder
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setContentTitle(title)
                      .setContentText(if (progress > 0) "Merging episodes · $progress%" else "Download running in background")
                      .setOngoing(true)
                      .setProgress(100, progress, false)
                      .build()
                  startForeground(NOTIFICATION_ID, notification)
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): android.os.IBinder? = null
          }

          class MainActivity : AudioServiceActivity() {
              private val downloadChannel = "app.stratus/downloads"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "app.stratus/player")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "getBrightness" -> {
                                  val current = window.attributes.screenBrightness
                                  val brightness = if (current >= 0f) current else {
                                      try {
                                          android.provider.Settings.System.getInt(
                                              contentResolver,
                                              android.provider.Settings.System.SCREEN_BRIGHTNESS
                                          ) / 255.0
                                      } catch (_: Exception) { 0.5 }
                                  }
                                  result.success(brightness.toDouble().coerceIn(0.0, 1.0))
                              }
                              "setBrightness" -> {
                                  val value = (call.arguments as? Number)?.toFloat()?.coerceIn(0f, 1f)
                                      ?: 0.5f
                                  window.attributes = window.attributes.apply { screenBrightness = value }
                                  result.success(true)
                              }
                              "resetBrightness" -> {
                                  window.attributes = window.attributes.apply { screenBrightness = -1f }
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "app.moviefox/task")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "moveToBackground") {
                              moveTaskToBack(true)
                              result.success(true)
                          } else result.notImplemented()
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "app.moviefox/download-foreground")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start", "update" -> {
                                  val args = call.arguments as? Map<*, *> ?: emptyMap<Any, Any>()
                                  val intent = Intent(this, DownloadForegroundService::class.java).apply {
                                      putExtra("title", args["title"]?.toString() ?: "MovieFox download")
                                      putExtra("progress", (args["progress"] as? Number)?.toInt() ?: 0)
                                  }
                                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                                      startForegroundService(intent)
                                  } else startService(intent)
                                  result.success(true)
                              }
                              "stop" -> {
                                  stopService(Intent(this, DownloadForegroundService::class.java))
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, downloadChannel)
                      .setMethodCallHandler { call, result ->
                          val manager = getSystemService(DOWNLOAD_SERVICE) as DownloadManager
                          when (call.method) {
                              "enqueue" -> try {
                                  if (android.os.Build.VERSION.SDK_INT >= 33 &&
                                      checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 9021)
                                  }
                                  val args = call.arguments as Map<*, *>
                                  val request = DownloadManager.Request(Uri.parse(args["url"].toString()))
                                  request.setTitle(args["title"]?.toString() ?: "MovieFox download")
                                  request.setDescription("Downloading")
                                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                  request.setDestinationInExternalFilesDir(this, Environment.DIRECTORY_DOWNLOADS, args["fileName"].toString())
                                  (args["headers"] as? Map<*, *>)?.forEach { (key, value) ->
                                      if (key != null && value != null) request.addRequestHeader(key.toString(), value.toString())
                                  }
                                  result.success(manager.enqueue(request).toInt())
                              } catch (e: Exception) { result.error("ENQUEUE_FAILED", e.message, null) }
                              "queryAll" -> try {
                                  val ids = ((call.arguments as? Map<*, *>)?.get("ids") as? List<*>)?.mapNotNull { (it as? Number)?.toLong() } ?: emptyList()
                                  if (ids.isEmpty()) { result.success(emptyList<Map<String, Any?>>()); return@setMethodCallHandler }
                                  val query = DownloadManager.Query().setFilterById(*ids.toLongArray())
                                  val cursor = manager.query(query)
                                  val rows = mutableListOf<Map<String, Any?>>()
                                  cursor.use {
                                      while (it.moveToNext()) {
                                          fun col(name: String) = it.getColumnIndex(name)
                                          val id = it.getLong(col(DownloadManager.COLUMN_ID))
                                          val status = when (it.getInt(col(DownloadManager.COLUMN_STATUS))) {
                                              DownloadManager.STATUS_SUCCESSFUL -> "complete"
                                              DownloadManager.STATUS_FAILED -> "failed"
                                              DownloadManager.STATUS_PAUSED -> "paused"
                                              DownloadManager.STATUS_RUNNING -> "running"
                                              else -> "queued"
                                          }
                                          rows.add(mapOf(
                                              "id" to id.toInt(),
                                              "title" to it.getString(col(DownloadManager.COLUMN_TITLE)),
                                              "fileName" to (it.getString(col(DownloadManager.COLUMN_TITLE)) ?: ""),
                                              "status" to status,
                                              "downloaded" to it.getLong(col(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)).toInt(),
                                              "total" to it.getLong(col(DownloadManager.COLUMN_TOTAL_SIZE_BYTES)).toInt(),
                                              "reason" to it.getInt(col(DownloadManager.COLUMN_REASON)),
                                              "localUri" to (if (it.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI) >= 0) it.getString(col(DownloadManager.COLUMN_LOCAL_URI)) else null)
                                          ))
                                      }
                                  }
                                  result.success(rows)
                              } catch (e: Exception) { result.error("QUERY_FAILED", e.message, null) }
                              "cancel", "remove" -> {
                                  val id = ((call.arguments as? Map<*, *>)?.get("id") as? Number)?.toLong()
                                  result.success(if (id == null) false else manager.remove(id) > 0)
                              }
                              "open" -> try {
                                  val id = ((call.arguments as? Map<*, *>)?.get("id") as Number).toLong()
                                  val uri = manager.getUriForDownloadedFile(id)
                                  if (uri == null) result.success(false) else {
                                      val intent = Intent(Intent.ACTION_VIEW).setDataAndType(uri, contentResolver.getType(uri) ?: "*/*")
                                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      startActivity(intent)
                                      result.success(true)
                                  }
                              } catch (e: Exception) { result.error("OPEN_FAILED", e.message, null) }
                              "saveMergedToGallery" -> try {
                                  val args = call.arguments as Map<*, *>
                                  val source = File(args["path"].toString())
                                  val name = args["fileName"].toString()
                                  val values = ContentValues().apply {
                                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                                      put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                                      put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/MovieFox")
                                  }
                                  val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                                      ?: throw IllegalStateException("Could not create gallery file")
                                  contentResolver.openOutputStream(uri)?.use { output -> FileInputStream(source).use { input -> input.copyTo(output) } }
                                      ?: throw IllegalStateException("Could not open gallery output")
                                  result.success(true)
                              } catch (e: Exception) { result.error("GALLERY_FAILED", e.message, null) }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          EOF
          echo "Configured MainActivity for audio_service FlutterEngine"

      - name: Declare Android audio playback service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          content = path.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />',
          ]
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in content:
                  content = content.replace('    <application', permission + '\n    <application', 1)
          service = '''        <service
                  android:name="com.moviefox.moviefox.DownloadForegroundService"
                  android:foregroundServiceType="dataSync"
                  android:exported="false" />
              <service
                  android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService" />
                  </intent-filter>
              </service>
              <receiver
                  android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MEDIA_BUTTON" />
                  </intent-filter>
              </receiver>
          '''
          if 'com.ryanheise.audioservice.AudioService' not in content:
              content = content.replace('    </application>', service + '    </application>', 1)
          if 'com.ryanheise.audioservice.MediaButtonReceiver' not in content:
              raise SystemExit('Could not declare AudioService media button receiver')
          path.write_text(content)
          print('Declared AudioService, MediaButtonReceiver and Android 14 media playback permissions')
          PY

      - name: Enable Android cleartext support for audio request compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/src/main/AndroidManifest.xml')
          content = path.read_text()
          pattern = r'<application\b([^>]*)>'
          match = re.search(pattern, content, re.S)
          if not match:
              raise SystemExit('Android application tag missing')
          attrs = match.group(1)
          if 'android:usesCleartextTraffic' not in attrs:
              attrs += ' android:usesCleartextTraffic="true"'
              content = content[:match.start()] + '<application' + attrs + '>' + content[match.end():]
          path.write_text(content)
          print('Enabled cleartext support for just_audio local proxy and HTTP-to-HTTPS CDN redirects')
          PY

      - name: Set Android launcher name to MovieFox
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/src/main/AndroidManifest.xml')
          content = path.read_text()
          updated, count = re.subn(r'android:label="[^"]*"', 'android:label="MovieFox"', content, count=1)
          if count != 1:
              raise SystemExit('Could not set Android launcher label to MovieFox')
          path.write_text(updated)
          print('Verified launcher label: MovieFox')
          PY

      - name: Add release internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          content = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in content:
              content = content.replace('    <application', permission + '    <application', 1)
          if 'android.permission.INTERNET' not in content:
              raise SystemExit('Could not add INTERNET permission to release manifest')
          path.write_text(content)
          print('Verified INTERNET permission in release manifest')
          PY

      - name: Enable fullscreen content in display cutouts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('android/app/src/main/res/values/styles.xml')
          content = path.read_text()
          item = '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>'
          for style in ('LaunchTheme', 'NormalTheme'):
              pattern = rf'(<style name="{style}"[^>]*>)(.*?)(</style>)'
              match = re.search(pattern, content, re.S)
              if not match:
                  raise SystemExit(f'Missing {style} in styles.xml')
              if 'windowLayoutInDisplayCutoutMode' not in match.group(2):
                  content = content[:match.start()] + match.group(1) + match.group(2) + '\n' + item + '\n' + match.group(3) + content[match.end():]
          path.write_text(content)
          print('Enabled short-edge display cutout layout for fullscreen playback')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Add JioTV DRM support to the native ExoPlayer pipeline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev' / 'video_player_android-*'
          plugin_dirs = list((Path.home() / '.pub-cache' / 'hosted' / 'pub.dev').glob('video_player_android-*'))
          if not plugin_dirs:
              raise SystemExit('video_player_android source was not found after flutter pub get')
          plugin = plugin_dirs[-1] / 'android/src/main/java/io/flutter/plugins/videoplayer'
          plugin_file = plugin / 'VideoPlayerPlugin.java'
          asset_file = plugin / 'VideoAsset.java'
          http_asset_file = plugin / 'HttpVideoAsset.java'
          for path in (plugin_file, asset_file, http_asset_file):
              if not path.exists():
                  raise SystemExit(f'Missing expected ExoPlayer source: {path}')

          source = plugin_file.read_text()
          if 'app.moviefox/jiotv_exoplayer_drm' not in source:
              source = source.replace(
                  'import io.flutter.plugin.common.BinaryMessenger;',
                  'import io.flutter.plugin.common.BinaryMessenger;\n'
                  'import io.flutter.plugin.common.MethodChannel;'
              )
              anchor = '    flutterState.startListening(this, binding.getBinaryMessenger());'
              if anchor not in source:
                  raise SystemExit('Could not locate VideoPlayerPlugin engine attach point')
              source = source.replace(anchor, anchor + '''
              new MethodChannel(binding.getBinaryMessenger(), "app.moviefox/jiotv_exoplayer_drm")
                  .setMethodCallHandler((call, result) -> {
                    if ("setDrmConfig".equals(call.method) && call.arguments instanceof java.util.Map) {
                      HttpVideoAsset.setPendingDrmConfig((java.util.Map<?, ?>) call.arguments);
                      result.success(null);
                    } else if ("clearDrmConfig".equals(call.method) && call.arguments instanceof java.util.Map) {
                      Object uri = ((java.util.Map<?, ?>) call.arguments).get("uri");
                      if (uri != null) HttpVideoAsset.clearPendingDrmConfig(uri.toString());
                      result.success(null);
                    } else {
                      result.notImplemented();
                    }
                  });
          ''')
              plugin_file.write_text(source)

          source = asset_file.read_text()
          old = 'return new HttpVideoAsset(remoteUrl, streamingFormat, new HashMap<>(httpHeaders), userAgent);'
          new = 'return new HttpVideoAsset(remoteUrl, streamingFormat, new HashMap<>(httpHeaders), userAgent, HttpVideoAsset.takePendingDrmConfig(remoteUrl));'
          if old in source:
              source = source.replace(old, new)
              asset_file.write_text(source)
          elif new not in source:
              raise SystemExit('Could not connect JioTV DRM config to video asset creation')

          source = http_asset_file.read_text()
          if 'setPendingDrmConfig' not in source:
              source = source.replace(
                  'import android.content.Context;',
                  'import android.content.Context;\n'
                  'import android.net.Uri;'
              )
              source = source.replace(
                  'import androidx.media3.common.MediaItem;',
                  'import androidx.media3.common.MediaItem;\n'
                  'import androidx.media3.common.C;\n'
                  'import androidx.media3.exoplayer.drm.DefaultDrmSessionManager;\n'
                  'import androidx.media3.exoplayer.drm.FrameworkMediaDrm;\n'
                  'import androidx.media3.exoplayer.drm.LocalMediaDrmCallback;'
              )
              source = source.replace(
                  'import java.util.Map;',
                  'import java.util.Map;\n'
                  'import java.util.HashMap;\n'
                  'import java.util.concurrent.ConcurrentHashMap;\n'
                  'import java.nio.charset.StandardCharsets;'
              )
              source = source.replace(
                  '  @NonNull private final StreamingFormat streamingFormat;',
                  '''  private static final Map<String, Map<String, Object>> PENDING_DRM = new ConcurrentHashMap<>();

          static void setPendingDrmConfig(Map<?, ?> config) {
            Object uri = config.get("uri");
            if (uri == null) return;
            Map<String, Object> copy = new HashMap<>();
            for (Map.Entry<?, ?> entry : config.entrySet()) {
              if (entry.getKey() != null) copy.put(entry.getKey().toString(), entry.getValue());
            }
            PENDING_DRM.put(uri.toString(), copy);
          }

          static void clearPendingDrmConfig(String uri) { PENDING_DRM.remove(uri); }
          static Map<String, Object> takePendingDrmConfig(String uri) { return PENDING_DRM.remove(uri); }

          @Nullable private final Map<String, Object> drmConfig;
          @NonNull private final StreamingFormat streamingFormat;'''
              )
              source = source.replace(
                  '      @Nullable String userAgent) {',
                  '      @Nullable String userAgent, @Nullable Map<String, Object> drmConfig) {'
              )
              source = source.replace(
                  '    this.userAgent = userAgent;',
                  '    this.userAgent = userAgent;\n    this.drmConfig = drmConfig;'
              )
              source = source.replace(
                  '    return builder.build();',
                  '''    if (drmConfig != null && "widevine".equalsIgnoreCase(String.valueOf(drmConfig.get("scheme")))) {
                String licenseUrl = String.valueOf(drmConfig.get("licenseUrl"));
                if (licenseUrl.startsWith("http")) {
                  Map<String, String> licenseHeaders = stringHeaders(drmConfig.get("headers"));
                  builder.setDrmConfiguration(
                      new MediaItem.DrmConfiguration.Builder(C.WIDEVINE_UUID)
                          .setLicenseUri(Uri.parse(licenseUrl))
                          .setMultiSession(true)
                          .setLicenseRequestHeaders(licenseHeaders)
                          .build());
                }
              }
              } else if (drmConfig != null && "clearkey".equalsIgnoreCase(String.valueOf(drmConfig.get("scheme")))) {
                builder.setDrmConfiguration(
                    new MediaItem.DrmConfiguration.Builder(C.CLEARKEY_UUID)
                        .setMultiSession(true)
                        .build());
              }
              return builder.build();''',
                  1
              )
              source = source.replace(
                  '    return new DefaultMediaSourceFactory(context).setDataSourceFactory(dataSourceFactory);',
                  '''    DefaultMediaSourceFactory mediaSourceFactory =
                new DefaultMediaSourceFactory(context).setDataSourceFactory(dataSourceFactory);
            if (drmConfig != null && "clearkey".equalsIgnoreCase(String.valueOf(drmConfig.get("scheme")))) {
              String clearKey = String.valueOf(drmConfig.get("clearKey"));
              if (clearKey.isEmpty() || "null".equals(clearKey)) {
                throw new IllegalArgumentException("JioTV ClearKey data is missing");
              }
              DefaultDrmSessionManager drmManager =
                  new DefaultDrmSessionManager.Builder()
                      .setUuidAndExoMediaDrmProvider(C.CLEARKEY_UUID, FrameworkMediaDrm.DEFAULT_PROVIDER)
                      .setMultiSession(true)
                      .build(new LocalMediaDrmCallback(clearKey.getBytes(StandardCharsets.UTF_8)));
              mediaSourceFactory.setDrmSessionManagerProvider(mediaItem -> drmManager);
            }
            return mediaSourceFactory;'''
              )
              source = source.replace(
                  '  @NonNull\\n  @Override\\n  public MediaSource.Factory getMediaSourceFactory(@NonNull Context context) {',
                  '  @OptIn(markerClass = UnstableApi.class)\\n  @NonNull\\n  @Override\\n  public MediaSource.Factory getMediaSourceFactory(@NonNull Context context) {'
              )
              marker = '  // TODO: Migrate to stable API, see https://github.com/flutter/flutter/issues/147039.'
              helper = '''  private static Map<String, String> stringHeaders(Object raw) {
            Map<String, String> result = new HashMap<>();
            if (raw instanceof Map) {
              for (Map.Entry<?, ?> entry : ((Map<?, ?>) raw).entrySet()) {
                if (entry.getKey() != null && entry.getValue() != null) {
                  result.put(entry.getKey().toString(), entry.getValue().toString());
                }
              }
            }
            return result;
          }

          '''
              source = source.replace(marker, helper + marker, 1)
              http_asset_file.write_text(source)
          else:
              print('JioTV DRM support already present in video_player_android')

          print('Installed JioTV ClearKey/Widevine support in Flutter video_player ExoPlayer')
          PY

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Enable high-resolution ExoPlayer playback and decoder fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / '.pub-cache' / 'hosted' / 'pub.dev'
          candidates = list(root.glob('video_player_android-*/android/src/main/java/**/*.java'))
          patched = 0
          for path in candidates:
              source = path.read_text()
              if 'androidx.media3.exoplayer.ExoPlayer' not in source or 'new ExoPlayer.Builder(context)' not in source:
                  continue
              if 'import androidx.media3.exoplayer.DefaultRenderersFactory;' not in source:
                  source = source.replace(
                      'import androidx.media3.exoplayer.ExoPlayer;',
                      'import androidx.media3.exoplayer.ExoPlayer;' + chr(10) +
                      'import androidx.media3.exoplayer.DefaultRenderersFactory;' + chr(10) +
                      'import androidx.media3.exoplayer.trackselection.DefaultTrackSelector;'
                  )
              helper = '''
              private static DefaultTrackSelector createUnrestrictedTrackSelector(Context context) {
                  DefaultTrackSelector selector = new DefaultTrackSelector(context);
                  selector.setParameters(selector.buildUponParameters()
                      .clearVideoSizeConstraints()
                      .setMaxVideoSize(Integer.MAX_VALUE, Integer.MAX_VALUE)
                      .setExceedVideoConstraintsIfNecessary(true)
                      .setExceedRendererCapabilitiesIfNecessary(true));
                  return selector;
              }
              '''
              if 'createUnrestrictedTrackSelector' not in source:
                  match = re.search(r'(^[ \t]*(?:public[ \t]+)?(?:final[ \t]+)?class[ \t]+\w+[^{]*\{)', source, re.M)
                  if not match:
                      raise SystemExit(f'Could not find Java class declaration in {path}')
                  source = source[:match.end()] + helper + source[match.end():]
              source = source.replace(
                  'new ExoPlayer.Builder(context)',
                  'new ExoPlayer.Builder(context, new DefaultRenderersFactory(context)'
                  '.setEnableDecoderFallback(true)'
                  '.setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER))'
                  '.setTrackSelector(createUnrestrictedTrackSelector(context))'
              )
              path.write_text(source)
              patched += 1
          if patched == 0:
              raise SystemExit('Could not safely patch video_player_android ExoPlayer builder')
          print(f'Enabled decoder fallback and unrestricted video sizes in {patched} Android player source file(s)')
          PY

      - name: Disable broken transitive Android lint task
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          // Work around an upstream Android Lint CommentDetector crash in
          // url_launcher_android during release builds. This does not skip
          // Dart analysis or APK compilation.
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieFox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          target_commitish: main
          name: MovieFox Release ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.{0}', github.run_number) }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
